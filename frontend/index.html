<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SecureID — Identity made simple</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="brand-panel">
        <div class="brand"><span class="brand-mark">♜</span><span>SecureID</span></div>
        <div class="brand-copy">
          <p class="eyebrow">SECURE ACCESS</p>
          <h1>Identity made<br /><em>simple.</em></h1>
          <p>Protect what matters with a secure, seamless sign-in experience.</p>
        </div>
        <div class="brand-footer">© 2026 SecureID. All rights reserved.</div>
      </aside>
      <section class="content-panel">
        <header class="topbar">
          <div class="mobile-brand"><span class="brand-mark">♜</span> SecureID</div>
          <div class="mode-switch" role="tablist">
            <button class="mode-button active" data-mode="login">Log in</button>
            <button class="mode-button" data-mode="register">Create account</button>
          </div>
        </header>
        <div id="app" class="flow"></div>
      </section>
    </main>
    <script src="/src/config.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
